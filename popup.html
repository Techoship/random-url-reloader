<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 420px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      overflow: hidden;
    }
    
    .container {
      background: white;
      border-radius: 0;
      max-height: 600px;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      text-align: center;
      flex-shrink: 0;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .header-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    
    .content {
      padding: 16px 20px;
      overflow-y: auto;
      max-height: 480px;
      flex: 1;
    }
    
    .content::-webkit-scrollbar {
      width: 8px;
    }
    
    .content::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    .content::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 4px;
    }
    
    .content::-webkit-scrollbar-thumb:hover {
      background: #5568d3;
    }
    
    .status-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-radius: 10px;
      padding: 12px 15px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .status-card.running {
      background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
    }
    
    .status-card.stopped {
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
    }
    
    .status-text {
      font-weight: 600;
      font-size: 15px;
      color: #2d3748;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #48bb78;
      animation: pulse 2s infinite;
    }
    
    .status-card.stopped .status-indicator {
      background: #f56565;
      animation: none;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    
    .countdown-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      display: none;
    }
    
    .countdown-card.active {
      display: block;
    }
    
    .countdown-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 6px;
    }
    
    .countdown-time {
      font-size: 32px;
      font-weight: 700;
    }
    
    .reload-counter {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 8px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      transition: all 0.3s ease;
      white-space: nowrap;
      overflow-x: auto;
    }
    
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    textarea::placeholder {
      color: #a0aec0;
    }
    
    .checkbox-card {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    
    .checkbox-card:hover {
      border-color: #cbd5e0;
      background: #edf2f7;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }
    
    .checkbox-label-text {
      font-size: 13px;
      font-weight: 500;
      color: #2d3748;
    }
    
    .checkbox-label-desc {
      font-size: 11px;
      color: #718096;
      margin-top: 2px;
    }
    
    .radio-group {
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .radio-option {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
    }
    
    .radio-option:last-of-type {
      margin-bottom: 0;
    }
    
    .radio-option input[type="radio"] {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }
    
    .radio-label {
      font-size: 13px;
      font-weight: 500;
      color: #2d3748;
    }
    
    .interval-inputs {
      margin-left: 24px;
      margin-top: 10px;
      margin-bottom: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }
    
    .interval-inputs.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .input-row:last-child {
      margin-bottom: 0;
    }
    
    .input-group {
      flex: 1;
    }
    
    .input-group label {
      display: block;
      font-size: 10px;
      color: #718096;
      margin-bottom: 4px;
      font-weight: 500;
    }
    
    input[type="number"] {
      width: 100%;
      padding: 6px 10px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.3s ease;
    }
    
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .limit-group {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }
    
    .limit-group.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      margin-bottom: 10px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-start {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
    }
    
    .btn-start:active {
      transform: translateY(0);
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #fc6c8f 0%, #f43f5e 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
    }
    
    .btn-stop:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(244, 63, 94, 0.5);
    }
    
    .btn-stop:active {
      transform: translateY(0);
    }
    
    .footer {
      background: #f7fafc;
      padding: 10px 20px;
      text-align: center;
      font-size: 10px;
      color: #718096;
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <img class="header-icon" src="icon-48.png" alt="icon">
        URL Reloader
      </h1>
    </div>
    
    <div class="content">
      <div id="statusCard" class="status-card stopped">
        <span class="status-text" id="statusText">Stopped</span>
        <div class="status-indicator"></div>
      </div>
      
      <div id="countdownCard" class="countdown-card">
        <div class="countdown-label">Next Reload In</div>
        <div class="countdown-time">
          <span id="countdownTime">--</span><span style="font-size: 24px;">s</span>
        </div>
        <div class="reload-counter" id="reloadCounter"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label">URLs to Reload</label>
        <textarea
          id="urls"
          wrap="off"
          placeholder="https://example.com&#10;https://another-site.com&#10;Leave empty to use current tab"
        ></textarea>
      </div>
      
      <div class="form-group">
        <label class="form-label">URL Selection</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" name="urlSelection" id="randomSelection" value="random" checked>
            <span class="radio-label">Random Selection</span>
          </div>
          <div class="radio-option">
            <input type="radio" name="urlSelection" id="sequentialSelection" value="sequential">
            <span class="radio-label">Sequential Order</span>
          </div>
        </div>
      </div>
      
      <div class="checkbox-card">
        <label class="checkbox-label">
          <input type="checkbox" id="hardRefresh">
          <div>
            <div class="checkbox-label-text">Hard Refresh</div>
            <div class="checkbox-label-desc">Clear cache on each reload</div>
          </div>
        </label>
      </div>
      
      <div class="checkbox-card">
        <label class="checkbox-label">
          <input type="checkbox" id="pauseOnClick">
          <div>
            <div class="checkbox-label-text">Pause on Click</div>
            <div class="checkbox-label-desc">Stop reloading when page is clicked</div>
          </div>
        </label>
      </div>
      
      <div class="form-group">
        <label class="form-label">Reload Interval</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" name="intervalType" id="randomInterval" value="random" checked>
            <span class="radio-label">Random Interval</span>
          </div>
          <div id="randomOptions" class="interval-inputs">
            <div class="input-row">
              <div class="input-group">
                <label>Min (seconds)</label>
                <input type="number" id="minInterval" value="30" min="5">
              </div>
              <div class="input-group">
                <label>Max (seconds)</label>
                <input type="number" id="maxInterval" value="60" min="5">
              </div>
            </div>
          </div>
          
          <div class="radio-option">
            <input type="radio" name="intervalType" id="fixedInterval" value="fixed">
            <span class="radio-label">Fixed Interval</span>
          </div>
          <div id="fixedOptions" class="interval-inputs disabled">
            <div class="input-row">
              <div class="input-group">
                <label>Interval (seconds)</label>
                <input type="number" id="fixedIntervalValue" value="45" min="5">
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="checkbox-card">
        <label class="checkbox-label">
          <input type="checkbox" id="limitReloads">
          <div>
            <div class="checkbox-label-text">Limit Reloads</div>
            <div class="checkbox-label-desc">Stop after specific number of reloads</div>
          </div>
        </label>
        <div id="limitGroup" class="limit-group disabled">
          <div class="input-group">
            <label>Maximum Reloads</label>
            <input type="number" id="maxReloads" value="10" min="1">
          </div>
        </div>
      </div>
      
      <div class="button-group">
        <button id="start" class="btn-start">Start</button>
        <button id="stop" class="btn-stop">Stop</button>
      </div>
    </div>
    
    <div class="footer">
      Made for productivity
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
